function refreshVoices(){const previous=$('#voice').value;try{voices=synth?synth.getVoices().filter(v=>/^ru(?:[-_]|$)/i.test(v.lang)):[]}catch(e){voices=[]}$('#voice').innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${esc(v.name)}${v.localService?'（端末内）':''}</option>`).join(''):'<option>ロシア語の声が見つかりません</option>';if(voices[Number(previous)])$('#voice').value=previous;$('#audioStatus').textContent=voices.length?'ru-RUで読み上げます。合成音声の発音・自然さは声によって異なります。':synth?'ロシア語の音声が未読込、または未インストールです。音声を試すと再確認します。他の練習は利用できます。':'このブラウザは音声読み上げに対応していません。他の練習は利用できます。'}
function stop(){speechSerial++;clearTimeout(speechTimer);if(synth)synth.cancel()}
function speak(text){stop();if(!synth){$('#audioStatus').textContent='音声読み上げに未対応です。';return}if(!voices.length)refreshVoices();if(!voices.length){$('#audioStatus').textContent='ロシア語の音声がありません。端末にロシア語音声を追加して再度お試しください。聞き取りはスキップできます。';return}const u=new SpeechSynthesisUtterance(clean(text)), serial=speechSerial;u.lang='ru-RU';u.voice=voices[Number($('#voice').value)]||voices[0];u.rate=Number($('#rate').value);u.onstart=()=>{if(serial===speechSerial){clearTimeout(speechTimer);$('#audioStatus').textContent='再生中…'}};u.onend=()=>{if(serial===speechSerial)$('#audioStatus').textContent='再生しました。もう一度聴くこともできます。'};u.onerror=e=>{if(serial===speechSerial){clearTimeout(speechTimer);$('#audioStatus').textContent='音声を再生できませんでした。別の声を選ぶか、音声以外の練習をご利用ください。'}};try{synth.speak(u);speechTimer=setTimeout(()=>{if(serial===speechSerial)$('#audioStatus').textContent='再生されない場合は、別の声を試すか、端末の音声設定を確認してください。'},7000)}catch(e){$('#audioStatus').textContent='音声を再生できませんでした。'}}
const audio=(text,label='▶ 発音')=>`<button class="small" data-say="${esc(text)}">${label}</button>`;
$('#testAudio').onclick=()=>speak('Я читаю книгу.');$('#stopAudio').onclick=()=>{stop();$('#audioStatus').textContent='停止しました。'};if(synth)synth.addEventListener('voiceschanged',refreshVoices);refreshVoices();
$('#nav').innerHTML=Object.entries(labels).map(([k,l],i)=>`<button data-mode="${k}" aria-current="${k===mode?'page':'false'}"><span class="num">${String(i).padStart(2,'0')}</span>${l}</button>`).join('');
function navigate(m){stop();mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-current',b.dataset.mode===m?'page':'false'));if(m==='home')home();else if(m==='cards'){flipped=false;cards()}else if(m==='guide')guide();else start();stats();main.focus({preventScroll:true})}
function home(){main.innerHTML=`<div class="eyebrow">01 / 第一変化・現在形</div><h2>まずは、10問だけ。</h2><p class="muted">初級を一周したあなたへ。説明を読む前に、覚えている形を使ってみましょう。</p><div class="homecards"><button data-go="grammar"><span class="badge">おすすめ</span><strong>活用を思い出す →</strong><small>8動詞 × 6人称。選択と入力で確認。</small></button><button data-go="cards"><span class="badge">ウォームアップ</span><strong>単語から始める →</strong><small>意味・アクセント・例文をめくる。</small></button></div><p>${ru('я чита́ю · ты чита́ешь · мы чита́ем')}</p><details><summary>今回の範囲を30秒で確認</summary><p>扱う8語はすべて不完了体で、第一変化の規則的な型です。現在の行為・習慣・状態を表します。今回の8語は、現在形でもアクセントが同じ位置に残ります。</p><p>第一変化全体には -у / -ут や、語尾にアクセントのある -ёшь / -ёт などもあります。この教材はその全種類を扱うものではありません。-ать だけで第一変化とは判断できません（例：слы́шать は第二変化）。</p></details><p class="muted">間違えた問題は自動で保存。復習で正解するとリストから消えます。</p>`}
function cards(){const v=V[card],s=S.find(s=>s.v===card);main.innerHTML=`<div class="toolbar"><h2>単語カード</h2><span class="badge">${card+1} / ${V.length}</span></div><p class="muted">意味とアクセントを思い出してから、ロシア語をクリック。</p><button class="cardface" id="flip" aria-expanded="${flipped}"><span class="ru" lang="ru">${flipped?v.inf:v.id}</span><small>${flipped?'もう一度クリックで隠す':'クリックして答えを見る'}</small></button>${flipped?`<div class="answercard"><h3>${v.ja}</h3><p>アクセント：${ru(v.inf)}${v.id==='знать'?'（1音節。母音 а が強勢）':''} ${audio(v.inf)}</p><p>${ru(s.text)} ${audio(s.text,'▶ 例文')}</p><p class="muted">${s.ja}</p><div class="forms">${v.forms.map((f,p)=>`<div class="formcell"><span>${P[p]}</span><button data-say="${P[p].split(' / ')[0]} ${f}" lang="ru" class="ru">${f} <small>▶</small></button></div>`).join('')}</div></div>`:''}<div class="actions"><button id="prevCard">← 前の単語</button><button id="nextCard" class="primary">次の単語 →</button></div>`;$('#flip').onclick=()=>{flipped=!flipped;cards();$('#flip').focus()};$('#prevCard').onclick=()=>{card=(card+V.length-1)%V.length;flipped=false;cards()};$('#nextCard').onclick=()=>{card=(card+1)%V.length;flipped=false;cards()}}
function start(){queue=shuffle(mode==='review'?state.wrong.map(id=>byId[id]):bank.filter(q=>q.kind===mode&&(mode!=='grammar'||grammarFormat==='mix'||q.format===grammarFormat))).slice(0,mode==='review'?state.wrong.length:10);pos=0;score=0;sessionAttempts=0;renderQuestion()}
function keyboard(){return `<details class="keyboard"><summary>ロシア語キーボードを開く</summary><div class="keys">${[...'йцукенгшщзхъфывапролджэячсмитьбюё'].map(c=>`<button type="button" data-key="${c}" aria-label="${c} を入力">${c}</button>`).join('')}<button type="button" data-key=" ">空白</button><button type="button" data-key="back">⌫</button></div></details>`}
function renderQuestion(){answered=false;chosen=[];if(pos>=queue.length){finish();return}const q=queue[pos],v=V[q.v],s=q.s!==undefined?S[q.s]:null,t=q.t!==undefined?T[q.t]:null;let body='',options=[];
let top=`<div class="toolbar"><h2>${labels[mode]}</h2><span class="badge">${pos+1} / ${queue.length}問</span></div>${mode==='grammar'?`<label>出題形式 <select id="grammarFormat"><option value="mix">選択＋入力</option><option value="choice">選択のみ</option><option value="input">入力のみ</option></select></label><p class="muted">形式を切り替えると、新しい10問が始まります。</p>`:''}<div class="track"><div style="width:${pos/queue.length*100}%"></div></div>`;
if(mode==='review')top+=`<span class="badge">${labels[q.kind]}</span>`;
if(q.kind==='grammar'){body=`<p class="muted">${q.format==='choice'?'正しい現在形を選びましょう。':'現在形を入力しましょう。'}</p><div class="big">${ru(P[q.p])} <span class="muted">＋</span> ${ru(v.inf)}</div><p>${v.ja}</p>`;options=shuffle(v.forms.filter(x=>x!==q.answer)).slice(0,3).concat(q.answer)}
if(q.kind==='gap')body=`<p class="muted">空欄に動詞の現在形を入れましょう。</p><div class="big">${ru(s.subject)} ____ ${ru(s.tail+'.')}</div><p>${s.ja} <span class="badge" lang="ru">${v.inf}</span></p>`;
if(q.kind==='order'){body=`<p>${s.ja}</p><p class="muted">今回は「主語 → 動詞 → 残り」の順。単語をクリックして並べてください。<br>ロシア語には他の語順もありますが、ここでは指定の基本語順を練習します。</p><div id="assembled" class="tokens" aria-label="組み立てた文"></div><div id="wordbank" class="tokens" aria-label="使う単語"></div><button id="clearOrder" class="small">並べ直す</button>`;available=shuffle(clean(s.text).replace(/\.$/,'').split(' ').map((text,id)=>({text,id})));}
if(q.kind==='talk'){body=`<p class="muted">${t.cue}</p><div class="bubble"><div><span class="avatar">А</span>Анна</div><p>${ru(t.line)} ${audio(t.line,'▶ 質問')}</p><details><summary>質問の日本語</summary>${t.ja}</details></div>`;options=[t.answer,...t.wrong]}
if(q.kind==='listen')body=`<p class="muted">音声を聴いて、文全体を入力してください。何度でも再生できます。</p><div class="big">${audio(s.text,'▶ 文を聴く')}</div><p class="muted">音声が使えない場合は「スキップ」。成績には入りません。</p>`;
if(q.kind==='vocab'){body=q.format==='choice'?`<p class="muted">この動詞の意味は？</p><div class="big">${ru(v.inf)} ${audio(v.inf)}</div>`:`<p class="muted">ロシア語の不定形で答えましょう。</p><div class="big">${v.ja}</div>`;if(q.format==='choice')options=shuffle(V.filter(x=>x!==v).map(x=>x.ja)).slice(0,3).concat(q.answer)}
main.innerHTML=top+body+(q.format==='choice'?`<div class="options">${shuffle(options).map(x=>`<button class="${q.kind==='vocab'?'jp':'ru'}" ${q.kind==='vocab'?'':'lang="ru"'} data-answer="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:q.kind==='order'?'':`<form id="answerForm"><label for="answer">${q.kind==='listen'?'聞こえた文':'あなたの答え'}</label><input class="ru" id="answer" type="text" lang="ru" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${q.kind==='listen'?'文全体を入力':'キリル文字で入力'}"><small class="muted">アクセント記号は不要。大文字小文字・句読点・ё / е は区別しません。</small>${keyboard()}<button type="submit" class="primary" style="margin-top:16px">答え合わせ</button></form>`)+`<div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="skip" class="small">スキップ</button>${q.kind==='order'?'<button id="checkOrder" class="primary">答え合わせ</button>':''}<button id="next" class="primary" hidden>次の問題 →</button></div>`;
if($('#grammarFormat')){$('#grammarFormat').value=grammarFormat;$('#grammarFormat').onchange=e=>{grammarFormat=e.target.value;start()}}
if($('#answerForm'))$('#answerForm').onsubmit=e=>{e.preventDefault();submit($('#answer').value)};
if(q.kind==='order'){renderTokens();$('#clearOrder').onclick=()=>{chosen=[];renderTokens()};$('#checkOrder').onclick=()=>submit(chosen.map(id=>available.find(x=>x.id===id).text).join(' '))}
$('#skip').onclick=()=>{stop();pos++;renderQuestion()};$('#next').onclick=()=>{stop();pos++;renderQuestion()};
}
function renderTokens(){$('#assembled').innerHTML=chosen.length?chosen.map(id=>`<button class="ru" lang="ru" data-remove="${id}" aria-label="${esc(available.find(x=>x.id===id).text)} を戻す">${esc(available.find(x=>x.id===id).text)}</button>`).join(''):'<span class="muted">ここに文を組み立てます</span>';$('#wordbank').innerHTML=available.map(x=>`<button class="ru" lang="ru" data-token="${x.id}" ${chosen.includes(x.id)?'disabled':''}>${esc(x.text)}</button>`).join('')}
function submit(value){if(answered)return;const q=queue[pos];if(!value.trim()||(q.kind==='order'&&chosen.length!==available.length)){$('#feedback').textContent=q.kind==='order'?'すべての単語を並べてください。':'答えを入力してください。';return}answered=true;sessionAttempts++;const ok=norm(value)===norm(q.answer);state.total++;if(ok){state.correct++;score++;if(mode==='review')state.wrong=state.wrong.filter(id=>id!==q.id)}else if(!state.wrong.includes(q.id))state.wrong.push(q.id);save();
main.querySelectorAll('[data-answer],#answer,#answerForm button,[data-token],[data-remove],#clearOrder,#checkOrder').forEach(b=>b.disabled=true);main.querySelectorAll('[data-answer]').forEach(b=>{if(norm(b.dataset.answer)===norm(q.answer))b.classList.add('correct');else if(b.dataset.answer===value)b.classList.add('incorrect')});
const v=V[q.v],s=q.s!==undefined?S[q.s]:null,t=q.t!==undefined?T[q.t]:null;
let explanation=q.kind==='vocab'?`不定形 ${ru(v.inf)}：${esc(v.ja)}`:q.kind==='talk'?`自分ひとりなら я ＋ ${ru(v.forms[0])}、私たちなら мы ＋ ${ru(v.forms[3])}。`:`${ru(P[q.p])} に対応する語尾は ${ru(endings[q.p])}。${ru(v.inf+' → '+v.forms[q.p])}`;
$('#feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'✓ 正解！':q.kind==='order'?'指定の語順を確認しましょう。':'もう一度、形を確認しましょう。'}</strong>${ok?'':`<p>あなたの答え：${ru(value)}</p>`}<p>${q.kind==='vocab'&&q.format==='choice'?esc(q.answer):ru(q.answer)} ${audio(q.kind==='vocab'?v.inf:q.answer)}</p><p>${explanation}</p>${s?`<p>${ru(s.text)} ${q.kind==='gap'?audio(s.text,'▶ 例文'):''}<br>${esc(s.ja)}</p>`:''}${t?`<p><b>Анна：</b>${ru(t.reply)} ${audio(t.reply)}<br>${esc(t.replyJa)}</p>`:''}${!ok?'<small>復習リストに追加しました。</small>':mode==='review'?'<small>この問題を復習リストから外しました。</small>':''}</div>`;
$('#skip').hidden=true;$('#next').hidden=false;$('#next').textContent=pos===queue.length-1?'結果を見る →':'次の問題 →';$('#next').focus({preventScroll:true});
}
function finish(){main.innerHTML=`<div class="empty"><div class="eyebrow">${queue.length?'SESSION COMPLETE':'REVIEW'}</div><div class="ru" lang="ru">${queue.length?'Отли́чно!':'Всё хорошо́.'}</div><h2>${queue.length?'ひと区切り、おつかれさま。':'復習する問題はまだありません。'}</h2>${queue.length?`<p>今回の正答率：<strong>${sessionAttempts?Math.round(score/sessionAttempts*100)+'%':'—'}</strong><br>正解 ${score} / 回答 ${sessionAttempts}問 · スキップ ${queue.length-sessionAttempts}問</p>`:''}<p class="muted">復習リストに ${state.wrong.length} 問あります。</p><div class="row" style="justify-content:center"><button data-go="${mode==='review'?'grammar':mode}" class="primary">${mode==='review'?'文法ドリルへ':'もう1セット'}</button>${state.wrong.length?'<button data-go="review">間違いを復習 →</button>':''}<button data-go="cards">単語カードへ</button></div></div>`}
function guide(){main.innerHTML=`<h2>活用表・使い方</h2><div class="guide"><p>今回の8動詞は、第一変化の規則的な型（不完了体）。現在形では、不定形の <b>-ть</b> を外して <b>-ю / -ешь / -ет / -ем / -ете / -ют</b> を付けます。アクセント位置は変わりません。</p><p>これは今回の8語に使える手順です。第一変化のすべてに機械的に使える手順ではありません。第一変化には -у / -ут、強勢のある -ёшь / -ёт / -ём / -ёте などもあり、-ать でも第二変化の動詞があります。</p><label>動詞を選択 <select id="tableVerb">${V.map((v,i)=>`<option value="${i}">${v.inf} — ${v.ja}</option>`).join('')}</select></label><div id="table"></div><details><summary>採点と記録について</summary><p>入力はアクセント記号・大文字小文字・句読点・余分な空白・ё と е の違いを無視します。単語の綴りと語順は照合します。並べ替えは指定の基本語順のみを正解とします。</p><p>正答率は、スキップを除く全回答（復習も含む）の累計です。同じ問題の連打では記録は増えません。復習では正解した問題だけリストから外れます。単語カードは採点しません。</p><p>記録はこのブラウザの保存領域を使います。ファイルの移動、別ブラウザ、プライベートブラウズ、ブラウザのデータ削除により引き継がれない場合があります。</p><button id="reset" class="small">学習記録をリセット</button></details><details><summary>音声・オフラインについて</summary><p>教材本体は外部の画像・ライブラリを読み込みません。音声はブラウザ標準の SpeechSynthesis を使い、ロシア語の声を選び ru-RU を指定します。ロシア語音声がない場合は、その旨を表示します。</p><p>「端末内」と表示される声はオフラインで使える場合があります。その他の声は通信が必要な場合があります。合成音声の品質は端末・声に依存します。教材のアクセント記号と合わせて確認してください。読み上げ時はアクセント記号を外した通常表記を渡します。</p></details><details><summary>教材の確認資料</summary><p>8動詞の6人称・現在形と強勢位置を辞書の活用表で照合（2026年9月27日）。例文・設問・日本語訳はこの教材用に作成しました。</p><p><a href="https://ruslanguage.ru/ru/self-study/first-conjugation/" target="_blank" rel="noopener">Ruslanguage — First Conjugation</a>：語尾と規則的な型の照合。</p><p>Викисловарь：${V.map(v=>`<a href="https://ru.wiktionary.org/wiki/${encodeURIComponent(v.id)}" target="_blank" rel="noopener" lang="ru">${v.id}</a>`).join(' / ')}。各語の現在形とアクセント位置を照合しました。</p><p>外部資料を開くときだけインターネット接続が必要です。</p></details></div>`;$('#tableVerb').onchange=table;table();$('#reset').onclick=()=>{if(confirm('累計成績と復習リストをすべてリセットしますか？')){state={total:0,correct:0,wrong:[]};save()}}}
function table(){const v=V[Number($('#tableVerb').value)];$('#table').innerHTML=`<table><caption>${ru(v.inf)} ${audio(v.inf)}</caption><thead><tr><th>人称</th><th>現在形</th><th>音声</th></tr></thead><tbody>${v.forms.map((f,p)=>`<tr><td lang="ru">${P[p]}</td><td>${ru(f)}</td><td>${audio(P[p].split(' / ')[0]+' '+f)}</td></tr>`).join('')}</tbody></table><p class="muted">´ がアクセント（強勢）の位置。単音節の знать には通常、記号を付けません。вы は複数の「あなたたち」と丁寧な単数の「あなた」の両方に使います。</p>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode)navigate(b.dataset.mode);else if(b.dataset.go)navigate(b.dataset.go);else if(b.dataset.say)speak(b.dataset.say);else if(b.dataset.answer)submit(b.dataset.answer);else if(b.dataset.token!==undefined&&!answered){chosen.push(Number(b.dataset.token));renderTokens()}else if(b.dataset.remove!==undefined&&!answered){chosen=chosen.filter(x=>x!==Number(b.dataset.remove));renderTokens()}else if(b.dataset.key!==undefined){const input=$('#answer');if(!input||input.disabled)return;let a=input.selectionStart,z=input.selectionEnd;const k=b.dataset.key;if(k==='back'){if(a===z)a=Math.max(0,a-1);input.setRangeText('',a,z,'end')}else input.setRangeText(k,a,z,'end');input.focus()}});
window.addEventListener('pagehide',stop);save();home();
</script></body></html>
